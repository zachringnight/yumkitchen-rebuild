name: Verify yumkitchen rebuild

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "social/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "tasks.md"
      - ".github/pull_request_template.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "social/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "tasks.md"
      - ".github/pull_request_template.md"
  workflow_dispatch:

concurrency:
  group: yum-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yumkitchen-web/package-lock.json

      - name: Install dependencies
        working-directory: yumkitchen-web
        run: npm ci

      - name: Install browser dependencies
        run: npx puppeteer browsers install chrome
        working-directory: yumkitchen-web

      - name: Run deterministic release gate
        run: SKIP_LH=1 bash verify.sh
