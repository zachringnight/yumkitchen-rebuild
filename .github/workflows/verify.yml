name: Verify yumkitchen rebuild

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yumkitchen-web/package-lock.json

      - name: Install dependencies
        working-directory: yumkitchen-web
        run: npm ci

      - name: Install browser dependencies
        run: npx puppeteer browsers install chrome
        working-directory: yumkitchen-web

      - name: Run verification gate
        run: bash verify.sh
