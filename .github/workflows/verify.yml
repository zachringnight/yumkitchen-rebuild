name: Verify yumkitchen rebuild

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yumkitchen-web/package-lock.json

      - name: Install dependencies
        working-directory: yumkitchen-web
        run: npm ci

      - name: Install browser dependencies
        run: npx puppeteer browsers install chrome
        working-directory: yumkitchen-web

      - name: Run verification gate
        # SKIP_LH=1: Lighthouse Performance is hardware-sensitive and craters on
        # GitHub's shared runners (historically Perf=48 vs 100 locally), which made
        # this gate flaky-red. CI enforces the deterministic checks (typecheck, lint,
        # build, content, axe a11y, links, motion audit, em-dash); Lighthouse stays
        # enforced locally where the numbers are real. See B6 in tasks.md.
        run: SKIP_LH=1 bash verify.sh
